<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read Book — Cyber Reads</title>
    <meta name="description" content="Read and download books from the Cyber Reads digital library.">
    <meta property="og:title" content="Read Book — Cyber Reads">
    <meta property="og:description" content="Read and download books from the Cyber Reads digital library.">
    <meta property="og:type" content="book">

    <link rel="icon" type="image/png" href="assets/img/icon.png">
    <link rel="stylesheet" href="assets/css/tailwind.min.css"/>
    <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body class="text-gray-900 bg-black antialiased">

    <a href="#bookDetailsContainer" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-[100] focus:bg-purple-700 focus:text-white focus:px-4 focus:py-2 focus:rounded-lg focus:font-semibold focus:shadow-lg">
        Skip to book details
    </a>

    <div class="text-zinc-950 bg-gray-100 flex flex-col w-full min-h-screen">
        
        <!-- Sticky Navigation Bar -->
        <header class="z-40 sticky top-0 border-b border-gray-200 bg-white/95 backdrop-blur-md flex-shrink-0 shadow-sm">
            <div class="px-4 sm:px-6 lg:px-12 w-full flex items-center h-20">
                <div class="justify-between items-center flex w-full gap-4">
                    
                    <a href="index.html" class="flex gap-3 sm:gap-4 items-center focus:outline-none focus:ring-2 focus:ring-purple-600 rounded-xl p-1" aria-label="Cyber Reads Home">
                        <div class="relative flex-shrink-0">
                            <img src="assets/img/logo1.jpg" alt="Cyber Reads Logo" width="56" height="56" class="relative z-10 rounded-lg h-12 sm:h-14 w-auto object-contain">
                        </div>
                        <span class="lg:text-3xl sm:text-2xl text-xl text-gray-900 font-extrabold tracking-tight">CYBER READS</span>
                    </a>
                    
                    <button id="homeButton" type="button" class="relative text-gray-100 px-5 sm:px-6 py-2.5 sm:py-3 bg-black hover:bg-purple-950 rounded-full font-semibold hover-lift transition-colors focus:outline-none focus:ring-2 focus:ring-purple-600 focus:ring-offset-2">
                        <span class="relative items-center gap-2 z-10 flex text-sm sm:text-base">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                            </svg>
                            <span>Home</span>
                        </span>
                    </button>

                </div>
            </div>
        </header>

        <!-- Main Book Details Split View -->
        <main class="flex-1 flex flex-col lg:flex-row">
            
            <!-- Book Cover Showcase Column -->
            <div class="w-full to-black bg-gradient-to-br p-6 sm:p-8 lg:p-12 flex items-center lg:w-[40%] from-zinc-900 justify-center">
                <div class="relative max-w-xs sm:max-w-sm w-full">
                    <div class="absolute blur-3xl inset-0 bg-purple-600/15 pointer-events-none" aria-hidden="true"></div>
                    
                    <div class="relative group aspect-[2/3] w-full rounded-2xl overflow-hidden bg-zinc-800 shadow-2xl border border-zinc-700/60">
                        <img id="bookCover" class="w-full h-full object-cover relative z-10" src="assets/img/1.jpg" alt="Book Cover" width="400" height="600" />
                    </div>
                </div>
            </div>

            <!-- Book Information Column -->
            <div class="w-full bg-gradient-to-br from-gray-100 to-gray-200 lg:w-[60%] text-black p-6 sm:p-8 lg:p-12 flex items-center">
                <div id="bookDetailsContainer" class="max-w-3xl mx-auto flex flex-col w-full h-full justify-between" aria-live="polite">
                    <p class="text-lg text-gray-600 py-12 text-center">Loading book details...</p>
                </div>
            </div>
        
        </main>
    
    </div>

    <!-- PDF Reading Section -->
    <section id="readNow" aria-labelledby="readingModeTitle" class="py-8 sm:py-12 w-full min-h-screen bg-black dark-surface">
        <div class="px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
            <div class="p-4 sm:p-6 border border-zinc-800 bg-zinc-900/90 rounded-t-2xl flex flex-wrap items-center justify-between gap-4">
                <div>
                    <h2 id="readingModeTitle" tabindex="-1" class="text-xl sm:text-2xl font-bold text-white focus:outline-none">Reading Mode</h2>
                    <p id="pdfStatusText" class="text-xs sm:text-sm text-gray-300 mt-1" role="status" aria-live="polite">Preparing reader...</p>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    <a id="openPdfNewTab" href="#" target="_blank" rel="noopener noreferrer"
                       class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-gray-100 border border-zinc-600 text-xs sm:text-sm font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <svg class="w-4 h-4 text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                        </svg>
                        <span>Open in New Tab</span>
                    </a>
                </div>
            </div>
            
            <div id="pdfViewerWrapper" class="pdf-container rounded-b-2xl overflow-hidden relative h-[70vh] sm:h-[80vh]">
                <iframe id="pdfIframe" src="about:blank" title="Book PDF Reader" class="w-full h-full border-0">
                    <p class="text-center text-gray-300 p-8">Your browser does not support inline PDFs. Please use the Open in New Tab or Download Book button below.</p>
                </iframe>

                <!-- Fallback overlay when PDF is unavailable or fails verification -->
                <div id="pdfFallbackMessage" class="hidden absolute inset-0 bg-zinc-950 flex-col items-center justify-center p-6 text-center z-20">
                    <svg class="w-12 h-12 text-purple-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                    <h3 class="text-lg sm:text-xl font-bold text-white mb-2" id="pdfFallbackHeading">PDF Preview Unavailable</h3>
                    <p class="text-sm sm:text-base text-gray-300 max-w-md mb-6" id="pdfFallbackBody">
                        We could not display the PDF inline. You can open it directly in a new tab or download a copy below.
                    </p>
                </div>
            </div>
            
            <div class="mt-8 flex flex-wrap justify-center gap-4">
                <a id="downloadLink" href="#" download class="rounded-xl hover-lift flex items-center gap-3 font-semibold btn-primary group px-8 py-4 focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <svg class="w-6 h-6 group-hover:text-purple-300 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"/>
                    </svg>
                    <span class="relative z-10 text-gray-100">Download Book</span>
                </a>
            </div>

        </div>
    </section>

    <script src="assets/js/bookRead.js"></script>
</body>
</html>
