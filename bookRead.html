<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <title>Cyber Reads</title>
    
    <link rel="icon" type="image/png" href="assets/img/icon.png">
    <link rel="stylesheet" href="assets/css/style.css"/>


    <style>
        
    </style >
    
    
</head>
<body class=" text-gray-900 bg-white">

    <div class=" text-zinc-950 bg-gray-100 flex flex-col w-full h-screen  ">
        
        <div class=" z-50  sticky top-0 border-b bg-purple-50/20 flex-shrink-0 glass-effect">
            <div class=" px-6 w-full flex  items-center  h-20 lg:px-12 ">
                <div class=" justify-between items-center  flex w-full ">
                    
                    <div class="flex gap-4 items-center ">
                        <div class="relative ">
                            <div class=" bg-purple-600/20 absolute inset-0 blur-xl "></div>
                            <img src="assets/img/logo1.jpg" alt="logo" class=" relative z-10 rounded-lg  h-16 ">
                        </div>
                        <h2 class=" lg:text-3xl text-2xl  text-outline-shadow-white  gradient-text  font-bold">CYBER READS</h2>
                    </div>
                    
                    <button id="homeButton" class="relative text-gray-100 px-6 py-3 bg-black rounded-full  font-medium hover-lift">
                        <span class="relative items-center gap-2  z-10 flex ">
                            <svg class="w-5 h-5" fill = "none" stroke = "currentColor" viewBox = "0 0 24 24">
                                <path stroke-linecap="round"  stroke-linejoin="round" stroke-width="2"  d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                            </svg>
                            Home
                        </span>
                    </button>

                </div>
            </div>
        </div>

        <div class = " overflow-hidden flex-1 flex flex-col lg:flex-row ">
            
            <div class = "w-full  to-black bg-gradient-to-br  p-8 flex items-center lg:w-[40%] h-1/2 lg:h-full  from-zinc-900 justify-center">
                <div class = " relative max-w-md w-full ">
                    <div  class = "absolute  blur-3xl inset-0 bg-purple-600/10  "></div>
                    
                    <div class="relative group ">
                        <div class = " opacity-0 inset-0 absolute  from-purple-600/20 to-transparent  bg-gradient-to-br group-hover:opacity-100 transition-opacity duration-500 rounded-2xl"></div>
                        <img id ="bookCover" class = "w-full object-cover  h-auto shadow-2xl hover-lift relative  rounded-2xl  z-10" src="" alt="Book Cover" />
                    
                    </div>
                
                </div>
            
            </div>

            <div class="w-full bg-gradient-to-br rounded-2xl  from-gray-100 to-gray-200  lg:w-[60%] h-1/2 lg:h-full  text-black p-8 overflow-y-auto">
                <div id="bookDetailsContainer" class="max-w-3xl mx-auto flex  flex-col h-full">
    
                
                </div>
            
            </div>
        
        </div>
    
    </div>



    <div id = "readNow" class = " py-8 w-full min-h-screen bg-black ">
        <div class = " px-4 lg:px-8 max-w-7xl mx-auto ">
            <div class=" p-6 border-b glass-effect rounded-t-2xl  border-gray-800">
                <h3 id="readingModeTitle" class="text-2xl font-bold gradient-text">Reading Mode </h3>
            </div>
            
            <div class="pdf-container rounded-b-2xl overflow-hidden" style="height: 80vh;">
                
                <iframe id="pdfIframe" src="" class="w-full h-full">

                    <p class="text-center text-gray-400 p-8 ">PDF viewer not supported. </p>
                
                </iframe>

            </div>
            
            <div class=" mt-8 flex justify-center ">
                <a id="downloadLink" href="" download class=" rounded-xl hover-lift flex items-center gap-3 font-medium btn-primary group px-8 py-4  ">
                    
                    <svg class = " w-6 h-6 group-hover:text-purple-300 text-purple-400 " fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"/></svg>
                    <span class = "relative z-10 text-gray-100"> Download Book </span>
                
                </a>

            </div>

        </div>

    </div>

    <script src="assets/js/bookRead.js "></script>
</body>
</html>
